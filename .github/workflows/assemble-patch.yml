name: Assemble reproducibility patch

on:
  push:
    paths:
      - '.bootstrap/qchunk_*.txt'
      - '.github/workflows/assemble-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and extract staged patch
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/qchunk_*.txt > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/patch.tar.xz
          tar -xJf /tmp/patch.tar.xz -C .
          rm -f .bootstrap/qchunk_*.txt .bootstrap/patch_*.txt
      - name: Commit reconstructed repository payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Complete reproducibility release payload"
          git push
