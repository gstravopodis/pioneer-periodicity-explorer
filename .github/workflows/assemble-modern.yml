name: Assemble staged modern module

on:
  push:
    paths:
      - '.bootstrap/modern_*.txt'
      - '.github/workflows/assemble-modern.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble staged source
        shell: bash
        run: |
          if [ ! -f .bootstrap/modern_000.txt ]; then
            echo "No staged modern module found; nothing to do."
            exit 0
          fi
          cat .bootstrap/modern_000.txt               .bootstrap/modern_001a.txt               .bootstrap/modern_002.txt               .bootstrap/modern_003.txt               .bootstrap/modern_004.txt               .bootstrap/modern_005.txt               .bootstrap/modern_006.txt               .bootstrap/modern_007.txt               .bootstrap/modern_008.txt               .bootstrap/modern_009.txt               .bootstrap/modern_010.txt               .bootstrap/modern_011.txt > src/modern.py
          rm .bootstrap/modern_*.txt
      - name: Commit assembled source
        shell: bash
        run: |
          if git diff --quiet -- src/modern.py .bootstrap; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modern.py .bootstrap
          git commit -m "Assemble modern analysis module"
          git push
